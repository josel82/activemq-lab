services:

  broker:
    image: apache/activemq-artemis:2.42.0
    container_name: activemq-broker
    environment:
      ARTEMIS_USER: labuser
      ARTEMIS_PASSWORD: labpass
      ANONYMOUS_LOGIN: "false"
    ports:
      - "8161:8161"
      - "61613:61613"
      - "61614:61614"
    volumes:
      - ./broker:/var/lib/artemis-instance/etc-override
    networks:
      - activemq-network

  python-producer:
    build:
      context: .
      dockerfile: python/producer/Dockerfile
    container_name: activemq-producer
    command: sleep infinity
    depends_on:
      - broker
    networks:
      - activemq-network
  
#  nodejs-producer:
#    build:
#      context: .
#      dockerfile: nodejs/producer/Dockerfile
#    container_name: activemq-producer
#    depends_on:
#      - broker
#    networks:
#      - activemq-network

  python-consumer:
    build:
      context: .
      dockerfile: python/consumer/Dockerfile
    container_name: python-consumer
    command: sleep infinity
    depends_on:
      - broker
    networks:
      - activemq-network

  nodejs-consumer:
    build:
      context: .
      dockerfile: nodejs/consumer/Dockerfile
    container_name: nodejs-consumer
    depends_on:
      - broker
    networks:
      - activemq-network

networks:
  activemq-network:
    driver: bridge